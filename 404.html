<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      var path = window.location.pathname;
      sessionStorage.setItem('redirect', path);
      window.location.replace(window.location.origin + '/');
    </script>
  </head>
  <body></body>
</html>
