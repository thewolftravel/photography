at Copper Mountain Colorado
Sat, January 24th 2026
Calling all women who love the snow, the slopes, and good vibes!
On Saturday, January 24, 2026, I’m hosting a Snowboarding Girls Meetup at Copper Mountain, Colorado and you’re invited.
This meetup is designed for intermediate-level riders ready to ride blue and black runs, connect with other skilled snowboarders, and push your riding to the next level. Whether you’re confident on blues or ready to challenge yourself on blacks, this day is all about riding together, learning from each other, and having fun.


Why You Should Join

Ride with like-minded women: Build friendships and share tips with a supportive community.

Level up your skills: Tackle blue and black runs with guidance and encouragement.

Mini photo session + giveaways: Capture your day on the mountain and enter to win a free snow session with me 📸.

Fun and inclusive environment: Focused on intermediate riders; all participants must be comfortable on blue and black runs.

Event Details

Where: Copper Mountain (Meet at bottom of Super Bee Lift)

When: Saturday, Jan 24, 2026 – Meet at 9:30 AM

Parking: Free at Alpine and Far East lots

Cost: Free (lift ticket not included)

Photos & Video: By attending, you agree to appear in photos and videos used by Karina Bittencourt Photographer

How to Reserve Your Spot

Spaces are open! Sign up here or at the end of this page

Don’t forget to follow me on Instagram @kbphotographer.sports
and Facebook Karina Bittencourt Photographer
– and tag your posts with #KBPGirlsonSnow so we can see your ride moments!

This is more than a snowboarding session – it’s a chance to ride intermediate runs with supportive women, grow your skills, and celebrate snowboarding together. I can’t wait to see you on the slopes!`;
